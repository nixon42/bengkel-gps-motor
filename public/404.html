    <!-- Open Graph Fallback for GitHub Pages SPA routing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bengkel.ueeee.my.id/" />
    <meta property="og:title" content="BengkelOS - Platform Cloud Manajemen & Tracking Servis Bengkel Mobil" />
    <meta property="og:description" content="Sistem operasi bengkel mobil modern: SPK digital, tracking servis real-time WhatsApp tanpa login, inventori suku cadang FIFO, dan kasir transparan." />
    <meta property="og:image" content="https://bengkel.ueeee.my.id/images/og/og-landing.jpg" />
    <meta property="og:image:secure_url" content="https://bengkel.ueeee.my.id/images/og/og-landing.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:image" content="https://bengkel.ueeee.my.id/images/og/og-landing.jpg" />
    <script type="text/javascript">
      // SPA redirect trick for GitHub Pages
      // Handles both custom domains (base /) and github.io subpaths (/repo-name/)
      var l = window.location;
      var repoSegments = l.pathname.split('/').filter(Boolean);
      var pathSegmentsToKeep = 0;

      // Auto-detect if running on username.github.io/<repo-name>
      if (l.hostname.endsWith('github.io') && repoSegments.length > 0) {
        pathSegmentsToKeep = 1;
      }

      var basePath = repoSegments.slice(0, pathSegmentsToKeep).map(function(s) { return '/' + s; }).join('');
      var routePath = repoSegments.slice(pathSegmentsToKeep).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (basePath || '') + '/?/' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
