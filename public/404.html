<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>BengkelOS Platform Cloud</title>
    <script type="text/javascript">
      // SPA redirect trick for GitHub Pages
      // Handles both custom domains (base /) and github.io subpaths (/repo-name/)
      var l = window.location;
      var repoSegments = l.pathname.split('/').filter(Boolean);
      var pathSegmentsToKeep = 0;

      // Auto-detect if running on username.github.io/<repo-name>
      if (l.hostname.endsWith('github.io') && repoSegments.length > 0) {
        pathSegmentsToKeep = 1;
      }

      var basePath = repoSegments.slice(0, pathSegmentsToKeep).map(function(s) { return '/' + s; }).join('');
      var routePath = repoSegments.slice(pathSegmentsToKeep).join('/');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (basePath || '') + '/?/' +
        routePath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
