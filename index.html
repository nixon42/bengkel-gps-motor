<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Bengkel Mobil GPS Motor Kediri - Sistem Pengelolaan Bengkel & Portal Tracking Status Servis Mobil" />
    <title>Bengkel Mobil GPS Motor Kediri</title>
    <!-- Anti-FOUC theme detection script -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
