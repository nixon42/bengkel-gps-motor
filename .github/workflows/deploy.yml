name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/supabase-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET || 'bucket3' }}
          VITE_SUPERADMIN_EMAILS: ${{ secrets.SUPERADMIN_EMAILS }}
          VITE_DEFAULT_TENANT_ID: ${{ secrets.DEFAULT_TENANT_ID || 'tenant-gps-motor-kediri-01' }}
          VITE_DEFAULT_WORKSHOP_NAME: ${{ secrets.DEFAULT_WORKSHOP_NAME || 'Bengkel Mobil Mitra' }}
          VITE_DEFAULT_WORKSHOP_PHONE: ${{ secrets.DEFAULT_WORKSHOP_PHONE || '085603307330' }}
          VITE_DEFAULT_WORKSHOP_ADDRESS: ${{ secrets.DEFAULT_WORKSHOP_ADDRESS || 'Jl. Raya Sambiresik No. 45, Gampengrejo, Kediri, Jawa Timur' }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
