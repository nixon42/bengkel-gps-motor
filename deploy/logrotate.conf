# Production Logrotate Configuration for Bengkel Mobil GPS Motor Kediri
# Target Path: /etc/logrotate.d/bengkel-gps-motor

/var/log/bengkel-gps-motor/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 bengkel bengkel
    dateext
    dateformat -%Y%m%d
}
