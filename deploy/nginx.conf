# ==============================================================================
# Production Nginx Configuration for Bengkel Mobil GPS Motor Kediri
# Tailored for 2 Core CPU, 2 GB RAM VPS
# Target: /etc/nginx/sites-available/bengkel-gps-motor.conf
# ==============================================================================

# Rate limiting zone for public tracking & login brute-force mitigation
limit_req_zone $binary_remote_addr zone=bengkel_limit:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _; # Ganti dengan domain (misal: bengkel.domainanda.com) atau biarkan _ untuk IP VPS

    # Client body limit (sesuai limit unggah foto/PDF backend)
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression (Hemat bandwidth & respon secepat kilat di mobile 3G/4G)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Vite Precompiled Static Assets (Hashed filenames - safe for 1-year immutable cache)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded media (Fotos & Nota)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
    }

    # Reverse Proxy to Node.js Backend Service
    location / {
        limit_req zone=bengkel_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection Timeouts optimal untuk VPS 2C
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Block sensitive hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
