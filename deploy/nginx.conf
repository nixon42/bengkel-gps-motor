# Nginx Configuration Template for Bengkel Mobil GPS Motor Kediri
# Tailored for 2 Core CPU, 2 GB RAM VPS
# Place in: /etc/nginx/sites-available/bengkel-gps-motor.conf
# Enable: ln -s /etc/nginx/sites-available/bengkel-gps-motor.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name bengkel.yourdomain.com; # Ganti dengan domain atau IP server Anda

    # Client body limit (sesuai limit upload backend)
    client_max_body_size 15M;

    # Gzip Compression untuk menghemat bandwidth & mempercepat akses mobile
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy ke Aplikasi Node.js / Docker
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings optimal untuk VPS 2C
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Assets Cache (Dist Vite build)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
