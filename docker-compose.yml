services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bengkel-gps-motor
    container_name: bengkel-gps-motor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/bengkel.db
      - UPLOAD_DIR=/app/uploads
      - SESSION_SECRET=${SESSION_SECRET:-bengkel_gps_motor_prod_secret_2026}
      - IMAGE_STORAGE_SALT=${IMAGE_STORAGE_SALT:-bengkel-gps-motor-secure-salt-2026}
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          cpus: '1.8'
          memory: 768M
        reservations:
          memory: 128M
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
